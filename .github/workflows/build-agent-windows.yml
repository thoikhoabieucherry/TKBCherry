name: Build Windows Agent candidate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-agent-windows.yml"
      - "agent_helper/**"
      - "agent_wasm_solver/**"
      - "rust_api/src/native_solver.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test Windows Agent
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build browser WASM solver
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { throw "Could not install the Rust WASM target." }
          cargo build --manifest-path agent_wasm_solver/Cargo.toml --target wasm32-unknown-unknown --release
          if ($LASTEXITCODE -ne 0) { throw "Could not build the Agent WASM solver." }
          $source = "agent_wasm_solver/target/wasm32-unknown-unknown/release/tkb_agent_wasm_solver.wasm"
          node tools/test-browser-wasm-abi.mjs $source
          if ($LASTEXITCODE -ne 0) { throw "The Agent WASM ABI smoke test failed." }
          $destination = "agent_helper/assets/tkb_native_solver.wasm"
          New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $item = Get-Item -LiteralPath $destination
          if ($item.Length -lt 100000) { throw "The Agent WASM solver artifact is unexpectedly small." }

      - name: Build isolated release candidate
        shell: pwsh
        run: >-
          ./agent_helper/build_windows.ps1
          -Python python
          -Clean
          -SkipReleaseSigning

      - name: Run Agent unit tests in the build environment
        shell: pwsh
        run: >-
          ./agent_helper/.build-windows/venv/Scripts/python.exe
          -m unittest discover -s agent_helper/tests -v

      - name: Record candidate version and hashes
        shell: pwsh
        run: |
          $version = & ./agent_helper/.build-windows/venv/Scripts/python.exe -c "import agent_helper; print(agent_helper.VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Could not read the Agent candidate version."
          }
          "AGENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $paths = @(
            "agent_helper/dist/TKBCherryAgent-Windows.zip",
            "agent_helper/dist/TKBCherryAgent.exe"
          )
          $hashes = foreach ($path in $paths) {
            $item = Get-Item -LiteralPath $path
            [ordered]@{
              path = $path
              size = $item.Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath agent_helper/dist/candidate-hashes.json -Encoding utf8
          @"
          This is an unsigned release candidate built and smoke-tested by GitHub Actions.
          Do not publish it until tools/agent-release/sign_release.py creates the
          DPAPI-backed TKBCherryAgent-release.json for these exact ZIP/EXE bytes.
          "@ | Set-Content -LiteralPath agent_helper/dist/DO-NOT-PUBLISH.txt -Encoding utf8

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TKBCherryAgent-Windows-${{ env.AGENT_VERSION }}-candidate
          path: |
            agent_helper/dist/TKBCherryAgent-Windows.zip
            agent_helper/dist/TKBCherryAgent.exe
            agent_helper/dist/candidate-hashes.json
            agent_helper/dist/DO-NOT-PUBLISH.txt
            agent_helper/assets/tkb_native_solver.wasm
            agent_wasm_solver/Cargo.lock
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
