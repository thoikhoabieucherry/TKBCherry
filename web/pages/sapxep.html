<script>
(function(){
  const optimizeWrap = document.getElementById("plannerOptimizeWrap");
  const toggleButton = document.getElementById("btnOptimizeMenu");
  const menu = document.getElementById("plannerOptimizeMenu");
  const ordinaryModes = new Set([
    "optimize_singletons",
    "optimize_sessions",
    "optimize_gap2",
    "optimize_gap1"
  ]);
  const superadminOnlyModes = new Set([]);

  function plannerOptimizeUserIsSuperadmin(){
    try{
      return String(window.TKBAuth?.currentUser?.()?.user?.role || "")
        .trim()
        .toLowerCase() === "superadmin";
    }catch(_){
      return false;
    }
  }

  function visibleOptimizeMenuItems(){
    return Array.from(menu?.querySelectorAll('[role="menuitem"]') || [])
      .filter(item => item.hidden !== true && item.getAttribute?.("aria-hidden") !== "true");
  }

  function syncPlannerOptimizeRoleAccess(){
    const superadmin = plannerOptimizeUserIsSuperadmin();
    for(const item of menu?.querySelectorAll('[data-superadmin-only="true"]') || []){
      item.hidden = !superadmin;
      item.setAttribute("aria-hidden", superadmin ? "false" : "true");
      if(superadmin) item.removeAttribute?.("tabindex");
      else item.setAttribute("tabindex", "-1");
    }
    return superadmin;
  }

  function plannerOptimizeModeAllowed(mode){
    return ordinaryModes.has(mode)
      || (superadminOnlyModes.has(mode) && plannerOptimizeUserIsSuperadmin());
  }

  function optimizeControlBusy(){
    return !toggleButton
      || toggleButton.disabled === true
      || toggleButton.getAttribute("aria-disabled") === "true"
      || window.__TKB_RUST_SOLVER_RUNNING === true
      || window.__TKB_SOLVE_UI_BUSY === true;
  }

  function setPlannerOptimizeMenuOpen(open, options){
    if(!toggleButton || !menu) return false;
    const shouldOpen = !!open && !optimizeControlBusy();
    menu.hidden = !shouldOpen;
    toggleButton.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
    if(shouldOpen && options?.focusFirst === true){
      visibleOptimizeMenuItems()[0]?.focus();
    }else if(!shouldOpen && options?.returnFocus === true && !toggleButton.disabled){
      toggleButton.focus();
    }
    return shouldOpen;
  }

  function togglePlannerOptimizeMenu(event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(optimizeControlBusy()) return setPlannerOptimizeMenuOpen(false);
    return setPlannerOptimizeMenuOpen(menu?.hidden !== false);
  }

  function runPlannerSchedulerMode(mode, event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    const normalizedMode = String(mode || "").trim();
    setPlannerOptimizeMenuOpen(false);
    if(optimizeControlBusy() || !plannerOptimizeModeAllowed(normalizedMode)) return false;
    if(typeof window.sapXepTheoCheDo !== "function") return false;
    return window.sapXepTheoCheDo(normalizedMode);
  }

  toggleButton?.addEventListener("keydown", (event) => {
    if(event.key !== "ArrowDown") return;
    event.preventDefault();
    event.stopPropagation();
    setPlannerOptimizeMenuOpen(true, {focusFirst:true});
  });

  menu?.addEventListener("keydown", (event) => {
    const items = visibleOptimizeMenuItems();
    const currentIndex = items.indexOf(document.activeElement);
    if(event.key === "Escape"){
      event.preventDefault();
      setPlannerOptimizeMenuOpen(false, {returnFocus:true});
      return;
    }
    if(event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const direction = event.key === "ArrowDown" ? 1 : -1;
    const nextIndex = currentIndex < 0
      ? (direction > 0 ? 0 : items.length - 1)
      : (currentIndex + direction + items.length) % items.length;
    items[nextIndex]?.focus();
  });

  document.addEventListener("click", (event) => {
    if(menu?.hidden !== false || optimizeWrap?.contains(event.target)) return;
    setPlannerOptimizeMenuOpen(false);
  });

  document.addEventListener("keydown", (event) => {
    if(event.key !== "Escape" || menu?.hidden !== false) return;
    event.preventDefault();
    setPlannerOptimizeMenuOpen(false, {returnFocus:true});
  });

  window.setPlannerOptimizeMenuOpen = setPlannerOptimizeMenuOpen;
  window.togglePlannerOptimizeMenu = togglePlannerOptimizeMenu;
  window.runPlannerSchedulerMode = runPlannerSchedulerMode;
  window.syncPlannerOptimizeRoleAccess = syncPlannerOptimizeRoleAccess;
  syncPlannerOptimizeRoleAccess();
  window.addEventListener?.("tkb:auth-ready", syncPlannerOptimizeRoleAccess);
})();

/* ============ NÚT THỬ NGHIỆM "TRỌN GÓI" (chỉ superadmin) ============
   Chuỗi: (1) luồng Sắp xếp hiện tại (giữ nguyên, không đụng) →
          (2) Tối ưu tất cả trong FET worker (mục tiêu 0 buổi 1 tiết,
              0 buổi trống ≥2, giảm trống 1 + tổng buổi).
   Tính năng xếp hiện tại trên web KHÔNG thay đổi; nút này chỉ để
   superadmin thử nghiệm pipeline trọn gói trước khi phổ cập. */
(function(){
  const btn = document.getElementById("btnTrialFullPipeline");
  if(!btn) return;

  function trialUserIsSuperadmin(){
    try{
      return String(window.TKBAuth?.currentUser?.()?.user?.role || "")
        .trim()
        .toLowerCase() === "superadmin";
    }catch(_){
      return false;
    }
  }

  function syncTrialButtonVisibility(){
    const on = trialUserIsSuperadmin();
    btn.hidden = !on;
    btn.setAttribute("aria-hidden", on ? "false" : "true");
  }

  function solveBusy(){
    return window.__TKB_RUST_SOLVER_RUNNING === true || window.__TKB_SOLVE_UI_BUSY === true;
  }

  async function waitForSolveIdle(maxMs){
    const t0 = Date.now();
    while(solveBusy() && (Date.now() - t0) < maxMs){
      await new Promise(r => setTimeout(r, 1000));
    }
    return !solveBusy();
  }

  async function runTrialFullPipeline(event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(btn.disabled || solveBusy() || !trialUserIsSuperadmin()) return false;
    btn.disabled = true;
    try{
      // MỘT worker duy nhất: xếp mới + tối ưu trọn gói (mode solve_optimize_all)
      // — một luồng UI, một lần apply, Dừng hoạt động xuyên suốt; không còn
      // chuỗi hai bước có thể bị lượt khác chen ngang (sửa 17/08).
      if(typeof window.sapXepTheoCheDo === "function"){
        return await window.sapXepTheoCheDo("solve_optimize_all");
      }
      return false;
    }finally{
      btn.disabled = false;
    }
  }

  window.runTrialFullPipeline = runTrialFullPipeline;

  // ============ NÚT "NEW ★" (superadmin): LUÔN xếp mới + pipeline KHÓA ======
  const btnNew = document.getElementById("btnNewLockedPipeline");
  function syncNewButtonVisibility(){
    if(!btnNew) return;
    const on = trialUserIsSuperadmin();
    btnNew.hidden = !on;
    btnNew.setAttribute("aria-hidden", on ? "false" : "true");
  }
  async function runNewLockedPipeline(event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(!btnNew || btnNew.disabled || solveBusy() || !trialUserIsSuperadmin()) return false;
    btnNew.disabled = true;
    try{
      if(typeof window.sapXepTheoCheDo === "function"){
        return await window.sapXepTheoCheDo("solve_optimize_all_fresh");
      }
      return false;
    }finally{
      btnNew.disabled = false;
    }
  }
  window.runNewLockedPipeline = runNewLockedPipeline;

  const syncBoth = () => { syncTrialButtonVisibility(); syncNewButtonVisibility(); };
  syncBoth();
  window.addEventListener?.("tkb:auth-ready", syncBoth);
})();
</script>
