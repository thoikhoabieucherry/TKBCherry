<style>
/* In standalone mode, keep controls clear of the iPhone status/home areas.
   Horizontal timetable space intentionally stays edge-to-edge. */
body.planner-shell {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* Keep feedback inline on desktop and below the compact mobile commands. */
body.planner-shell .toolbar-main {
  --planner-toolbar-button-width: clamp(72px, 5.4vw, 84px); /* 19/08: nut ngan lai */
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding-right: 0;
}

body.planner-shell .toolbar-actions {
  grid-column: 1;
  grid-row: 1;
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 6px;
  width: auto;
  min-width: 0;
}

body.planner-shell .toolbar-actions > .planner-optimize-wrap {
  position: relative;
  display: inline-flex;
  flex: 0 0 var(--planner-toolbar-button-width);
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
}

body.planner-shell .planner-optimize-wrap > #btnTestMenu {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 36px;
  min-height: 36px;
  padding: 0 9px;
  gap: 5px;
  border: 1px solid var(--tkb-border, #e2e8f0);
  border-radius: 8px;
  background: #fff;
  color: #334155;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}

body.planner-shell .planner-optimize-wrap > #btnTestMenu:hover:not(:disabled),
body.planner-shell .planner-optimize-wrap > #btnTestMenu[aria-expanded="true"] {
  border-color: #94a3b8;
  background: #f8fafc;
  color: #0f172a;
}

body.planner-shell .planner-optimize-wrap > #btnTestMenu.is-auto-sort-disabled,
body.planner-shell .planner-optimize-menu > button.is-auto-sort-disabled,
body.planner-shell .toolbar-actions > button.is-auto-sort-disabled,
body.planner-shell .toolbar-secondary-actions button.is-auto-sort-disabled,
body.planner-shell #btnRangBuoc.is-auto-sort-disabled,
body.planner-shell #btnAutoSort.is-auto-sort-disabled,
body.planner-shell #btnHome.is-auto-sort-disabled,
body.planner-shell #btnUndoTKB.is-auto-sort-disabled,
body.planner-shell #btnRedoTKB.is-auto-sort-disabled,
body.planner-shell #btnStatsPopover.is-auto-sort-disabled,
body.planner-shell #btnAgentHelper.is-auto-sort-disabled {
  opacity: .42 !important;
  cursor: not-allowed !important;
  filter: grayscale(.3) saturate(.5) !important;
  pointer-events: none !important;
}

body.planner-shell .planner-mode-icon {
  width: 17px;
  height: 17px;
  flex: none;
  pointer-events: none;
}

body.planner-shell .planner-optimize-menu {
  position: absolute;
  z-index: 1400;
  top: calc(100% + 6px);
  right: 0;
  display: grid;
  width: 164px;
  padding: 4px;
  gap: 2px;
  border: 1px solid var(--tkb-border, #e2e8f0);
  border-radius: 9px;
  background: #fff;
  box-shadow: 0 12px 30px rgb(15 23 42 / 18%);
}

body.planner-shell .planner-optimize-menu[hidden] {
  display: none !important;
}

body.planner-shell .planner-optimize-menu > button {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 36px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #1e293b;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  text-align: left;
  white-space: nowrap;
}

body.planner-shell .planner-optimize-menu > button[hidden] {
  display: none !important;
}

body.planner-shell .planner-optimize-menu > button:hover:not(:disabled) {
  background: #f1f5f9;
}

body.planner-shell .planner-optimize-menu > button:focus-visible {
  position: relative;
  z-index: 1;
  outline: 2px solid #2563eb;
  outline-offset: 1px;
  box-shadow: 0 0 0 3px rgb(37 99 235 / 18%);
}

@media (min-width: 901px) and (max-width: 1150px) and (hover: hover) and (pointer: fine) {
  body.planner-shell .toolbar-main {
    --planner-toolbar-button-width: 74px;
    gap: 5px;
  }

  body.planner-shell .toolbar-actions,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap {
    gap: 4px;
  }

}

@media (min-width: 901px) and (max-width: 1024px) and (hover: hover) and (pointer: fine) {
  body.planner-shell .toolbar-main {
    --planner-toolbar-button-width: 68px;
  }

}

/* Keep one DOM order everywhere. */
body.planner-shell .toolbar-actions > #btnRangBuoc,
body.planner-shell .toolbar-actions > #btnUndoTKB,
body.planner-shell .toolbar-actions > #btnRedoTKB,
body.planner-shell .toolbar-actions > #btnAutoSort,
body.planner-shell .toolbar-actions > .planner-optimize-wrap,
body.planner-shell .toolbar-actions > #btnStopAutoSort,
body.planner-shell .toolbar-actions > #btnDeleteAll {
  order: initial;
}

body.planner-shell .toolbar-actions > button {
  flex: 0 0 var(--planner-toolbar-button-width);
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  border-radius: 8px;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
  border-radius: 8px;
}

body.planner-shell #btnRangBuoc {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding-inline: 11px;
  border-color: #4d9b2c;
  background: #58ad32;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 3px 10px rgb(77 155 44 / 22%);
}

body.planner-shell #btnRangBuoc:hover:not(:disabled) {
  border-color: #3f8623;
  background: #479827;
}

body.planner-shell #btnRangBuoc .toolbar-requirement-icon {
  width: 18px;
  height: 18px;
  stroke-width: 2.8;
}

body.planner-shell .toolbar-actions > button.icon-button {
  display: inline-flex;
  flex: 0 0 var(--planner-toolbar-button-width);
  align-items: center;
  justify-content: center;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  padding: 0;
  border-radius: 8px;
  line-height: 1;
}

body.planner-shell .toolbar-icon {
  display: block;
  width: 19px;
  height: 19px;
  flex: none;
  pointer-events: none;
  transition: transform .16s ease;
}

body.planner-shell #btnUndoTKB .toolbar-icon,
body.planner-shell #btnRedoTKB .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnAutoSort .toolbar-icon {
  width: 18px;
  height: 18px;
  transform: translateX(1px);
}

body.planner-shell #btnEngineCherry .toolbar-icon {
  width: 25px;
  height: 25px;
  filter: drop-shadow(0 1px 3px rgba(239, 30, 60, 0.28));
}

body.planner-shell #btnEngineCherry:hover:not(:disabled) {
  border-color: #f87171;
  background: #fef2f2;
  box-shadow: 0 3px 10px rgba(239, 30, 60, 0.18);
}

/* Nút "Tối ưu v3" (22/08 đêm, trước là TEST): nhấn màu hổ phách ở chữ + icon
   cho đường engine v3 (máy chủ; bản Cherry Local chạy ngay trên máy). Ẩn trên
   điện thoại vì lưới nút mobile đặt grid-column cố định cho từng nút. */
body.planner-shell .planner-optimize-wrap > #btnTestMenu {
  color: #b45309;
}

body.planner-shell .planner-optimize-wrap > #btnTestMenu:hover:not(:disabled),
body.planner-shell .planner-optimize-wrap > #btnTestMenu[aria-expanded="true"] {
  border-color: #f0c98a;
  background: #fffbeb;
  color: #92400e;
}

/* 23/08 (chỉ đạo chủ dự án): trên điện thoại hiện Tối ưu v3 (icon) + Cherry + RB,
   ẩn ▶ FET — xem khối mobile bên dưới (không còn ẩn
   #plannerTestWrap theo bề rộng nữa). */

/* 21/08: thu hẹp thanh nút (desktop). Các nút CHỈ CÓ ICON không cần bề rộng
   72-84px như nút có chữ — co về 46px, thanh nút ngắn lại ~180px mà không
   đụng layout mobile (media riêng bên dưới đã tự xếp lưới). */
@media (min-width: 901px) {
  body.planner-shell .toolbar-actions {
    gap: 4px;
  }

  body.planner-shell .toolbar-main .toolbar-actions > #btnUndoTKB,
  body.planner-shell .toolbar-main .toolbar-actions > #btnRedoTKB,
  body.planner-shell .toolbar-main .toolbar-actions > #btnAutoSort,
  body.planner-shell .toolbar-main .toolbar-actions > #btnEngineCherry,
  body.planner-shell .toolbar-main .toolbar-actions > #btnStopAutoSort,
  body.planner-shell .toolbar-main .toolbar-actions > #btnDeleteAll {
    flex: 0 0 46px;
    width: 46px;
    min-width: 46px;
    max-width: 46px;
  }
}

body.planner-shell #btnStopAutoSort .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnDeleteAll .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnDeleteAll {
  border-color: #dc2626;
  background: #dc2626;
  color: #fff;
  box-shadow: 0 3px 10px rgb(185 28 28 / 22%);
}

body.planner-shell #btnDeleteAll:hover:not(:disabled) {
  border-color: #b91c1c;
  background: #b91c1c;
}

body.planner-shell #btnStopAutoSort.is-active {
  border-color: #ef9a9a !important;
  background: #fff5f5 !important;
  color: #c62828 !important;
  box-shadow: 0 3px 10px rgb(198 40 40 / 14%);
}

body.planner-shell #btnStopAutoSort.is-active:hover:not(:disabled) {
  border-color: #e57373 !important;
  background: #ffebee !important;
  color: #b71c1c !important;
}

body.planner-shell .toolbar-actions > button.icon-button:hover:not(:disabled) .toolbar-icon {
  transform: scale(1.06);
}

body.planner-shell #btnAutoSort:hover:not(:disabled) .toolbar-icon {
  transform: translateX(1px) scale(1.06);
}

body.planner-shell .toolbar-label-compact {
  display: none;
}

body.planner-shell .toolbar-actions > button:focus-visible,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > button:focus-visible {
  position: relative;
  z-index: 1;
  outline: 2px solid #2563eb;
  outline-offset: 1px;
  box-shadow: 0 0 0 3px rgb(37 99 235 / 18%);
}

/* Keep the high-specificity history controls on the shared button width. */
body.planner-shell .toolbar-actions > #btnUndoTKB,
body.planner-shell .toolbar-actions > #btnRedoTKB {
  display: inline-flex;
  flex: 0 0 var(--planner-toolbar-button-width);
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  padding: 0;
  border-radius: 8px;
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
}

body.planner-shell .toolbar-actions > #btnStopAutoSort:not(.is-active) {
  display: none !important;
}

body.planner-shell .toolbar-actions > #btnStopAutoSort.is-active + #btnDeleteAll {
  display: none !important;
}

body.planner-shell .toolbar-secondary-actions {
  grid-column: 3;
  grid-row: 1;
  min-width: 0;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap {
  position: relative;
  inset: auto;
  display: inline-flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 6px;
  width: auto;
  min-width: 0;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
  flex: 0 0 var(--planner-toolbar-button-width);
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button {
  order: initial;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding-inline: 8px 10px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  color: #1e293b;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .16s ease;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button:hover:not(:disabled) {
  background: #f8fafc;
  border-color: #94a3b8;
}

body.planner-shell #btnAgentHelper .agent-status-dot {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 7px;
  height: 7px;
  border: 1.5px solid #fff;
  border-radius: 50%;
  background: #94a3b8;
  box-shadow: 0 1px 2px rgb(15 23 42 / 16%);
  pointer-events: none;
  transition: background-color .16s ease, box-shadow .16s ease;
}

body.planner-shell #btnAgentHelper[data-agent-state="enabled"] .agent-status-dot,
body.planner-shell #btnAgentHelper[data-agent-state="prepared"] .agent-status-dot {
  background: #16a34a;
}

body.planner-shell #btnAgentHelper[data-agent-state="active"] .agent-status-dot,
body.planner-shell #btnAgentHelper[data-agent-state="working"] .agent-status-dot {
  background: #22c55e;
}
body.planner-shell #btnAgentHelper[data-agent-state="fallback"] .agent-status-dot {
  background: #f59e0b;
}

body.planner-shell #btnAgentHelper[data-agent-state="working"] .agent-status-dot {
  animation: planner-agent-working-pulse 1.2s ease-in-out infinite;
}

body.planner-shell #btnAgentHelper[data-agent-state="error"] .agent-status-dot {
  background: #dc2626;
}

@keyframes planner-agent-working-pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgb(34 197 94 / 30%), 0 1px 3px rgb(15 23 42 / 24%);
  }
  50% {
    box-shadow: 0 0 0 4px rgb(34 197 94 / 12%), 0 1px 3px rgb(15 23 42 / 24%);
  }
}

@media (prefers-reduced-motion: reduce) {
  body.planner-shell #btnAgentHelper[data-agent-state="working"] .agent-status-dot {
    animation: none;
    box-shadow: 0 0 0 3px rgb(34 197 94 / 18%), 0 1px 3px rgb(15 23 42 / 24%);
  }
}

body.planner-shell #btnAgentHelper:disabled {
  opacity: 1;
  cursor: default;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button[hidden] {
  display: none !important;
}

body.planner-shell #btnAgentHelper[hidden] {
  display: none !important;
}

body.planner-shell #btnAgentHelper .agent-ai-icon {
  width: 16px;
  height: 16px;
  color: #7c3aed;
  stroke: #7c3aed;
  stroke-width: 2;
  fill: none;
  filter: drop-shadow(0 1px 2px rgb(124 58 237 / 18%));
  transition: all .16s ease;
}

body.planner-shell #btnAgentHelper.is-auto-sort-disabled {
  opacity: 1;
  cursor: not-allowed;
  filter: none;
  pointer-events: none;
}

body.planner-shell #btnAgentHelper.is-auto-sort-disabled .agent-ai-icon,
body.planner-shell #btnAgentHelper.is-auto-sort-disabled .agent-button-label {
  opacity: .45;
  filter: grayscale(.35) saturate(.55);
}

body.planner-shell #btnAgentHelper.is-auto-sort-disabled .agent-status-dot {
  z-index: 2;
  opacity: 1;
  filter: none;
}

body.planner-shell .toolbar-feedback {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

body.planner-shell .toolbar-feedback > #autoSortProgress {
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
  max-width: none;
}

body.planner-shell .toolbar-feedback > #autoSortProgress .auto-sort-label {
  flex: 0 0 auto;
  color: #475569;
  font-variant-numeric: tabular-nums;
}

body.planner-shell .toolbar-feedback > #autoSortProgress .auto-sort-metric {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: max-content !important;
  min-width: max-content !important;
  max-width: none !important;
  overflow: visible;
  background: #f0fdf4;
  border: 1.5px solid #86efac;
  border-radius: 9999px;
  padding: 3px 14px;
  color: #15803d;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

body.planner-shell .toolbar-feedback > #autoSortProgress .auto-sort-metric[hidden] {
  display: none !important;
}

body.planner-shell .toolbar-feedback > #statusMsg {
  flex: 1 1 180px;
  width: auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

body.planner-shell .toolbar-feedback > #statusMsg.is-auto-sort-running-label {
  min-inline-size: 14ch;
}

/* 19/08: thong bao dai bi cat mat phan quan trong (danh sach cho vuot Gioi
   han). Bam vao la mo rong ra doc het, bam lai thi thu gon. */
body.planner-shell .toolbar-feedback > #statusMsg.is-clamped {
  cursor: pointer;
}

body.planner-shell .toolbar-feedback > #statusMsg.is-clamped::after {
  content: " \25be";
  opacity: 0.7;
}

body.planner-shell .toolbar-feedback > #statusMsg.is-expanded {
  white-space: normal;

  text-overflow: clip;
  max-height: 40vh;

  line-height: 1.45;
  flex-basis: 100%;

body.planner-shell .toolbar-feedback > #statusMsg.is-expanded::after {
  content: " \25b4";
}

/* A narrow desktop remains a desktop toolbar; coarse-pointer devices use mobile rows. */
@media (max-width: 900px) and (hover: none) and (pointer: coarse),
       (max-width: 480px),
       (orientation: landscape) and (max-height: 540px) and (any-pointer: coarse) {
  html {
    height: var(--tkb-mobile-viewport-h, 100dvh);
    min-height: var(--tkb-mobile-viewport-h, 100dvh);
  }

  body.planner-shell {
    --planner-mobile-feedback-h: 46px;
    height: var(--tkb-mobile-viewport-h, 100dvh);
    min-height: var(--tkb-mobile-viewport-h, 100dvh);
    max-height: var(--tkb-mobile-viewport-h, 100dvh);
    padding-bottom: 0;
    overflow: hidden;
  }

  body.planner-shell .toolbar {
    padding: 5px;
    gap: 0;
  }

  body.planner-shell .toolbar-main {
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: 44px var(--planner-mobile-feedback-h);
    align-items: stretch;
    gap: 4px 2px;
  }

  body.planner-shell .toolbar-actions {
    display: contents;
  }

  body.planner-shell .toolbar-actions > button,
  body.planner-shell .toolbar-actions > .planner-optimize-wrap > .planner-mode-button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
    flex: 0 1 auto;
    width: 100%;
    min-width: 0;
    max-width: none;
    height: 44px;
    min-height: 44px;
    padding: 0 6px;
    border: 1px solid var(--tkb-border, #e2e8f0);
    border-radius: var(--tkb-radius, 10px);
    box-shadow: var(--tkb-shadow, 0 1px 3px rgb(15 23 42 / 6%));
    font-size: clamp(11px, 3.05vw, 13px);
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

<script>
/* ===== Menu "Tối ưu v3" (22/08 đêm — trước là nút TEST chỉ superadmin) =====
   4 mục tiêu riêng lẻ (1 tiết/buổi, buổi dạy, 2 tiết trống, 1 tiết trống)
   chạy bằng Cherry engine v3 trên máy chủ qua tkbRunEngine('cherry', _, {mode})
   → bridgeSapXepTuDongAll. Mỗi lượt 45s, chỉ tối ưu mục tiêu đã chọn trên lịch
   đang có; các chỉ số khác bị khóa không được xấu đi; không vi phạm ràng buộc;
   kết quả chỉ được áp khi tốt hơn (cổng Cherry). Công khai cho mọi người dùng. */
(function(){
  const wrap = document.getElementById("plannerTestWrap");
  const toggleButton = document.getElementById("btnTestMenu");
  const menu = document.getElementById("plannerTestMenu");
  if(!wrap || !toggleButton || !menu) return;

  function testUserIsSuperadmin(){
    try{
      return String(window.TKBAuth?.currentUser?.()?.user?.role || "")
        .trim()
        .toLowerCase() === "superadmin";
    }catch(_){
      return false;
    }
  }

  function syncPlannerTestRoleAccess(){
    const superadmin = testUserIsSuperadmin();
    // Menu Tối ưu v3 công khai; chỉ nút chẩn đoán "RB" (kiểm tra ràng buộc)
    // cạnh nút Home còn dành riêng superadmin (nút "Lỗi" đã bỏ 22/08 khuya).
    wrap.hidden = false;
    wrap.setAttribute("aria-hidden", "false");
    ["btnConstraintAudit"].forEach(id => {
      const btn = document.getElementById(id);
      if(btn){
        btn.hidden = !superadmin;
        btn.setAttribute("aria-hidden", superadmin ? "false" : "true");
      }
    });
    return superadmin;
  }

  function testControlBusy(){
    return window.__TKB_RUST_SOLVER_RUNNING === true
      || window.__TKB_SOLVE_UI_BUSY === true;
  }

  function setPlannerTestMenuOpen(open){
    const shouldOpen = !!open && !testControlBusy();
    menu.hidden = !shouldOpen;
    toggleButton.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
    return shouldOpen;
  }

  // 25/08 đêm: khi đang có lượt xếp khác chạy, nút/menu Tối ưu v3 từng bỏ qua
  // cú bấm trong im lặng → người dùng tưởng lane "Buổi dạy" không hoạt động.
  // Luôn nói rõ lý do.
  function reportTestControlBusy(){
    try{ window._setStatus?.("Đang có lượt xếp/tối ưu khác chạy — bấm Dừng hoặc đợi xong rồi mới chọn Tối ưu.", "warning"); }catch(_){ }
  }

  function togglePlannerTestMenu(event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(testControlBusy()){ reportTestControlBusy(); return setPlannerTestMenuOpen(false); }
    return setPlannerTestMenuOpen(menu.hidden !== false);
  }

  const V3_MODE_LABELS = {
    optimize_singletons: "1 tiết/buổi",
    optimize_sessions: "Buổi dạy",
    optimize_gap2: "2 tiết trống",
    optimize_gap1: "1 tiết trống"
  };

  function runPlannerV3Mode(mode, event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    setPlannerTestMenuOpen(false);
    const normalized = String(mode || "").trim();
    if(!V3_MODE_LABELS[normalized]) return false;
    if(testControlBusy()){ reportTestControlBusy(); return false; }
    if(typeof window.bridgeSapXepTuDongAll !== "function" || typeof window.tkbRunEngine !== "function"){
      try{ window._setStatus?.("Bộ giải chưa sẵn sàng (tkb-rust-bridge.js chưa nạp), vui lòng tải lại trang.", "error"); }catch(_){ }
      return false;
    }
    try{ window._setStatus?.(`Tối ưu — ${V3_MODE_LABELS[normalized]}: đang tối ưu trên lịch hiện tại (≈120 giây)…`, "info"); }catch(_){ }
    // Đi đúng đường nút Cherry (engine v3, warm-start, cổng "không xấu hơn"),
    // chỉ thêm mục tiêu riêng lẻ.
    window.tkbRunEngine("cherry", null, { mode: normalized });
    return true;
  }
  // Tên cũ (TEST) giữ làm bí danh cho các đoạn mã/test còn gọi.
  const runPlannerTestMode = runPlannerV3Mode;

  document.addEventListener("click", (event) => {
    if(menu.hidden !== false || wrap.contains(event.target)) return;
    setPlannerTestMenuOpen(false);
  });
  document.addEventListener("keydown", (event) => {
    if(event.key !== "Escape" || menu.hidden !== false) return;
    setPlannerTestMenuOpen(false);
  });

  window.togglePlannerTestMenu = togglePlannerTestMenu;
  window.runPlannerV3Mode = runPlannerV3Mode;
  window.runPlannerTestMode = runPlannerTestMode;
  syncPlannerTestRoleAccess();
  window.addEventListener?.("tkb:auth-ready", syncPlannerTestRoleAccess);
})();
</script>

if(typeof window.tkbRunEngine !== "function")
window.tkbRunEngine = function(engine, btn, options){
  if(window.__TKB_SOLVE_UI_BUSY === true || window.__TKB_RUST_SOLVER_RUNNING === true){
    try{ window.setStatus && window.setStatus("Đang có lượt xếp chạy, vui lòng chờ.", "info"); }catch(_){}
    return;
  }
  var focusMode = String((options && options.mode) || "").trim();
  window.__TKB_FORCE_ENGINE = String(engine || "");
  window.__TKB_ENGINE_FOCUS_MODE = focusMode;
  window.__CURRENT_ACTIVE_ENGINE = String(engine || "");
  window.__TKB_LAST_REQUESTED_ENGINE = String(engine || "");
  window.__TKB_LAST_ENGINE_CLICK_AT = Date.now();
  window.__CURRENT_ACTIVE_OPTIMIZE_METRIC_LABEL = "";
  var metricEl = document.getElementById("autoSortProgressMetric");
  if(metricEl){
    metricEl.textContent = "";
    metricEl.hidden = true;
  }
  var clear = function(){
    window.__TKB_FORCE_ENGINE = "";
    window.__TKB_ENGINE_FOCUS_MODE = "";
    window.__CURRENT_ACTIVE_ENGINE = "";
    window.__CURRENT_ACTIVE_OPTIMIZE_METRIC_LABEL = "";
  };
  try{
    // QUAN TRONG: tren ban production, window.sapXepTuDongAll van la bo giai
    // chay trong TRINH DUYET (phanmon.js executeDirectFastSchedule) — no khong
    // biet settings.engine va khong bao gio goi backend/Cloud Run.
    // Hai nut nay phai goi thang ban cua bridge de di duong may chu.
    var runner = (typeof window.bridgeSapXepTuDongAll === "function")
      ? window.bridgeSapXepTuDongAll
      : window.sapXepTuDongAll;
    if(typeof runner !== "function"){ clear(); return; }
    var invocation = { manualAgentInvite: false };
    if(focusMode) invocation.mode = focusMode;
    var r = runner(invocation);
    if(r && typeof r.finally === "function") r.finally(clear);
    else window.setTimeout(clear, 5000);
  }catch(e){ clear(); }
};
</script>
</body>
