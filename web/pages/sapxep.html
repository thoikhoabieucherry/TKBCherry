<style>
/* In standalone mode, keep controls clear of the iPhone status/home areas.
   Horizontal timetable space intentionally stays edge-to-edge. */
body.planner-shell {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* Keep feedback inline on desktop and below the compact mobile commands. */
body.planner-shell .toolbar-main {
  --planner-toolbar-button-width: clamp(96px, 7.2vw, 104px);
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding-right: 0;
}

body.planner-shell .toolbar-actions {
  grid-column: 1;
  grid-row: 1;
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 6px;
  width: auto;
  min-width: 0;
}

/* Focused solve modes are desktop-only. The touch toolbar stays compact on
   phones and tablets. */
body.planner-shell .desktop-solve-controls {
  display: none;
}

@media (min-width: 901px) and (hover: hover) and (pointer: fine) {
  body.planner-shell .desktop-solve-controls {
    position: relative;
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  body.planner-shell .desktop-solve-controls > .planner-mode-button,
  body.planner-shell .desktop-solve-controls > .planner-optimize-wrap > .planner-mode-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    height: 36px;
    min-height: 36px;
    padding: 0 9px;
    gap: 5px;
    border: 1px solid var(--tkb-border, #e2e8f0);
    border-radius: 8px;
    background: #fff;
    color: #334155;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
    white-space: nowrap;
  }

  body.planner-shell .desktop-solve-controls > #btnQuickComplete {
    width: 82px;
  }

  body.planner-shell .desktop-solve-controls > .planner-optimize-wrap > #btnOptimizeMenu {
    width: 78px;
  }

  body.planner-shell .desktop-solve-controls .planner-mode-button:hover:not(:disabled),
  body.planner-shell .desktop-solve-controls .planner-mode-button[aria-expanded="true"] {
    border-color: #94a3b8;
    background: #f8fafc;
    color: #0f172a;
  }

  body.planner-shell .desktop-solve-controls .planner-mode-button:focus-visible,
  body.planner-shell .planner-optimize-menu > button:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 1px;
    box-shadow: 0 0 0 3px rgb(37 99 235 / 18%);
  }

  body.planner-shell .desktop-solve-controls .planner-mode-icon {
    width: 15px;
    height: 15px;
    flex: none;
    pointer-events: none;
  }

  body.planner-shell .planner-optimize-wrap {
    position: relative;
    display: inline-flex;
  }

  body.planner-shell .planner-optimize-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 90;
    display: grid;
    width: 154px;
    padding: 4px;
    gap: 2px;
    border: 1px solid var(--tkb-border, #e2e8f0);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 10px 28px rgb(15 23 42 / 16%);
  }

  body.planner-shell .planner-optimize-menu[hidden] {
    display: none !important;
  }

  body.planner-shell .planner-optimize-menu > button {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #1e293b;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
    text-align: left;
    white-space: nowrap;
  }

  body.planner-shell .planner-optimize-menu > button:hover:not(:disabled) {
    background: #f1f5f9;
  }
}

@media (min-width: 901px) and (max-width: 1150px) and (hover: hover) and (pointer: fine) {
  body.planner-shell .toolbar-main {
    --planner-toolbar-button-width: 88px;
    gap: 5px;
  }

  body.planner-shell .toolbar-actions,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap {
    gap: 4px;
  }

  body.planner-shell .desktop-solve-controls > #btnQuickComplete {
    width: 74px;
    padding-inline: 7px;
  }

  body.planner-shell .desktop-solve-controls > .planner-optimize-wrap > #btnOptimizeMenu {
    width: 70px;
    padding-inline: 7px;
  }
}

@media (min-width: 901px) and (max-width: 1024px) and (hover: hover) and (pointer: fine) {
  body.planner-shell .toolbar-main {
    --planner-toolbar-button-width: 80px;
  }

  body.planner-shell .desktop-solve-controls > #btnQuickComplete {
    width: 70px;
  }

  body.planner-shell .desktop-solve-controls > .planner-optimize-wrap > #btnOptimizeMenu {
    width: 64px;
  }

  body.planner-shell .desktop-solve-controls .planner-mode-icon {
    display: none;
  }
}

/* Keep one DOM order everywhere. */
body.planner-shell .toolbar-actions > #btnRangBuoc,
body.planner-shell .toolbar-actions > #btnUndoTKB,
body.planner-shell .toolbar-actions > #btnRedoTKB,
body.planner-shell .toolbar-actions > #btnAutoSort,
body.planner-shell .toolbar-actions > #btnStopAutoSort,
body.planner-shell .toolbar-actions > #btnDeleteAll {
  order: initial;
}

body.planner-shell .toolbar-actions > button {
  flex: 0 0 var(--planner-toolbar-button-width);
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  border-radius: 8px;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
  border-radius: 8px;
}

body.planner-shell #btnRangBuoc {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding-inline: 11px;
  border-color: #4d9b2c;
  background: #58ad32;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 3px 10px rgb(77 155 44 / 22%);
}

body.planner-shell #btnRangBuoc:hover:not(:disabled) {

}

body.planner-shell #btnRangBuoc .toolbar-requirement-icon {
  width: 18px;
  height: 18px;
  stroke-width: 2.8;
}

body.planner-shell .toolbar-actions > button.icon-button {
  display: inline-flex;
  flex: 0 0 var(--planner-toolbar-button-width);
  align-items: center;
  justify-content: center;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  padding: 0;
  border-radius: 8px;
  line-height: 1;
}

body.planner-shell .toolbar-icon {
  display: block;
  width: 19px;
  height: 19px;
  flex: none;
  pointer-events: none;
  transition: transform .16s ease;
}

body.planner-shell #btnUndoTKB .toolbar-icon,
body.planner-shell #btnRedoTKB .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnAutoSort .toolbar-icon {
  width: 18px;
  height: 18px;
  transform: translateX(1px);
}

body.planner-shell #btnStopAutoSort .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnDeleteAll .toolbar-icon {
  width: 20px;
  height: 20px;
}

body.planner-shell #btnDeleteAll {
  border-color: #dc2626;
  background: #dc2626;
  color: #fff;
  box-shadow: 0 3px 10px rgb(185 28 28 / 22%);
}

body.planner-shell #btnDeleteAll:hover:not(:disabled) {
  border-color: #b91c1c;
  background: #b91c1c;
}

body.planner-shell #btnStopAutoSort.is-active {
  border-color: #ef9a9a !important;
  background: #fff5f5 !important;
  color: #c62828 !important;
  box-shadow: 0 3px 10px rgb(198 40 40 / 14%);
}

body.planner-shell #btnStopAutoSort.is-active:hover:not(:disabled) {
  border-color: #e57373 !important;
  background: #ffebee !important;
  color: #b71c1c !important;
}

body.planner-shell .toolbar-actions > button.icon-button:hover:not(:disabled) .toolbar-icon {
  transform: scale(1.06);
}

body.planner-shell #btnAutoSort:hover:not(:disabled) .toolbar-icon {
  transform: translateX(1px) scale(1.06);
}

body.planner-shell .toolbar-label-compact {
  display: none;
}

body.planner-shell .toolbar-actions > button:focus-visible,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > button:focus-visible {
  position: relative;
  z-index: 1;
  outline: 2px solid #2563eb;
  outline-offset: 1px;
  box-shadow: 0 0 0 3px rgb(37 99 235 / 18%);
}

/* Keep the high-specificity history controls on the shared button width. */
body.planner-shell .toolbar-actions > #btnUndoTKB,
body.planner-shell .toolbar-actions > #btnRedoTKB {
  display: inline-flex;
  flex: 0 0 var(--planner-toolbar-button-width);
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
  padding: 0;
  border-radius: 8px;
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
}

body.planner-shell .toolbar-actions > #btnStopAutoSort:not(.is-active) {
  display: none !important;
}

body.planner-shell .toolbar-actions > #btnStopAutoSort.is-active + #btnDeleteAll {
  display: none !important;
}

body.planner-shell .toolbar-secondary-actions {
  grid-column: 3;
  grid-row: 1;
  min-width: 0;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap {
  position: relative;
  inset: auto;
  display: inline-flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 6px;
  width: auto;
  min-width: 0;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
  flex: 0 0 var(--planner-toolbar-button-width);
  box-sizing: border-box;
  width: var(--planner-toolbar-button-width);
  min-width: var(--planner-toolbar-button-width);
  max-width: var(--planner-toolbar-button-width);
  height: 36px;
  min-height: 36px;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button {
  order: initial;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding-inline: 6px;
}

body.planner-shell #btnAgentHelper .agent-status-dot {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 8px;
  height: 8px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #dc2626;
  box-shadow: 0 1px 3px rgb(15 23 42 / 24%);
  pointer-events: none;
}

body.planner-shell #btnAgentHelper[data-agent-state="active"] .agent-status-dot,
body.planner-shell #btnAgentHelper[data-agent-state="working"] .agent-status-dot {
  background: #16a34a;
}

body.planner-shell #btnAgentHelper[data-agent-state="working"] .agent-status-dot {
  box-shadow: 0 0 0 3px rgb(22 163 74 / 18%), 0 1px 3px rgb(15 23 42 / 24%);
}

body.planner-shell #btnAgentHelper:disabled {
  opacity: 1;
  cursor: default;
}

body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button[hidden] {
  display: none !important;
}

body.planner-shell #btnAgentHelper[hidden] {
  display: none !important;
}

body.planner-shell #btnAgentHelper .agent-ai-icon {
  width: 17px;
  height: 17px;
  color: #6d28d9;
  filter: drop-shadow(0 1px 2px rgb(109 40 217 / 18%));
}

body.planner-shell #btnHome.is-auto-sort-disabled {
  opacity: .45;
  cursor: default;
  filter: saturate(.6);
}

body.planner-shell .toolbar-feedback {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

body.planner-shell .toolbar-feedback > #autoSortProgress {
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
  max-width: none;
}

body.planner-shell .toolbar-feedback > #statusMsg {
  flex: 1 1 180px;
  width: auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

body.planner-shell .toolbar-feedback > #statusMsg.is-auto-sort-running-label {
  min-inline-size: 14ch;
}

/* A narrow desktop remains a desktop toolbar; coarse-pointer devices use mobile rows. */
@media (max-width: 900px) and (hover: none) and (pointer: coarse),
       (max-width: 480px),
       (orientation: landscape) and (max-height: 540px) and (any-pointer: coarse) {
  html {
    height: var(--tkb-mobile-viewport-h, 100dvh);
    min-height: var(--tkb-mobile-viewport-h, 100dvh);
  }

  body.planner-shell {
    --planner-mobile-feedback-h: 46px;
    height: var(--tkb-mobile-viewport-h, 100dvh);
    min-height: var(--tkb-mobile-viewport-h, 100dvh);
    max-height: var(--tkb-mobile-viewport-h, 100dvh);
    padding-bottom: 0;
    overflow: hidden;
  }

  body.planner-shell .toolbar {
    padding: 5px;
    gap: 0;
  }

  body.planner-shell .toolbar-main {
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: 44px var(--planner-mobile-feedback-h);
    align-items: stretch;
    gap: 4px 2px;
  }

  body.planner-shell .toolbar-actions {
    display: contents;
  }

  body.planner-shell .toolbar-actions > button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button,
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle {
    flex: 0 1 auto;
    width: 100%;
    min-width: 0;
    max-width: none;
    height: 44px;
    min-height: 44px;
    padding: 0 6px;
    border: 1px solid var(--tkb-border, #e2e8f0);
    border-radius: var(--tkb-radius, 10px);
    box-shadow: var(--tkb-shadow, 0 1px 3px rgb(15 23 42 / 6%));
    font-size: clamp(11px, 3.05vw, 13px);
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .16s ease, border-color .16s ease, box-shadow .12s ease, transform .12s ease;
  }

  body.planner-shell .toolbar-actions > button:active:not(:disabled),
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .save-button:active:not(:disabled),
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .agent-helper-button:active:not(:disabled),
  body.planner-shell .toolbar-secondary-actions .stats-popover-wrap > .stats-toggle:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 1px 1px rgb(15 23 42 / 8%);
  }

  body.planner-shell .toolbar-actions > #btnRangBuoc {
    grid-column: 1;
    grid-row: 1;
    gap: 0;
    padding: 0;
  }

  body.planner-shell .toolbar-actions > #btnUndoTKB {
    grid-column: 2;
    grid-row: 1;
    align-self: end;
  }

  body.planner-shell .toolbar-actions > #btnRedoTKB {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
  }

  body.planner-shell .toolbar-actions > #btnUndoTKB,
  body.planner-shell .toolbar-actions > #btnRedoTKB {
    flex: none;
    width: 100%;
    min-width: 0;
    height: 22px;
    min-height: 22px;
  }

  body.planner-shell .toolbar-actions > #btnRedoTKB {
    border-radius: var(--tkb-radius, 10px) var(--tkb-radius, 10px) 0 0;
  }

  body.planner-shell .toolbar-actions > #btnUndoTKB {
    border-radius: 0 0 var(--tkb-radius, 10px) var(--tkb-radius, 10px);

  body.planner-shell .toolbar-actions > #btnAutoSort {

    grid-row: 1;

  body.planner-shell .toolbar-actions > #btnStopAutoSort,
  body.planner-shell .toolbar-actions > #btnDeleteAll {

  body.planner-shell .toolbar-actions > button.icon-button {
    flex: 0 1 auto;

    max-width: none;
    height: 44px;
    min-height: 44px;
    padding: 0;
  }

  body.planner-shell .toolbar-actions > #btnDeleteAll {

  }

<script>
(function(){
  const desktopModeQuery = "(min-width: 901px) and (hover: hover) and (pointer: fine)";
  const desktopModeMedia = typeof window.matchMedia === "function"
    ? window.matchMedia(desktopModeQuery)
    : {matches:false};
  const controls = document.getElementById("desktopSolveControls");
  const toggleButton = document.getElementById("btnOptimizeMenu");
  const menu = document.getElementById("plannerOptimizeMenu");
  const allowedModes = new Set([
    "quick_complete",
    "optimize_singletons",
    "optimize_sessions",
    "optimize_gaps"
  ]);

  function setPlannerOptimizeMenuOpen(open, options){
    if(!toggleButton || !menu) return false;
    const shouldOpen = !!open && desktopModeMedia.matches === true;
    menu.hidden = !shouldOpen;
    toggleButton.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
    if(shouldOpen && options?.focusFirst === true){
      menu.querySelector('[role="menuitem"]')?.focus();
    }else if(!shouldOpen && options?.returnFocus === true){
      toggleButton.focus();
    }
    return shouldOpen;
  }

  function togglePlannerOptimizeMenu(event){
    event?.preventDefault();
    event?.stopPropagation();
    return setPlannerOptimizeMenuOpen(menu?.hidden !== false);
  }

  function runPlannerSchedulerMode(mode, event){
    event?.preventDefault();
    event?.stopPropagation();
    const normalizedMode = String(mode || "").trim();
    if(!allowedModes.has(normalizedMode)) return false;
    setPlannerOptimizeMenuOpen(false);
    if(typeof window.sapXepTheoCheDo !== "function") return false;
    return window.sapXepTheoCheDo(normalizedMode);
  }

  toggleButton?.addEventListener("keydown", (event) => {
    if(event.key !== "ArrowDown") return;
    event.preventDefault();
    event.stopPropagation();
    setPlannerOptimizeMenuOpen(true, {focusFirst:true});
  });

  menu?.addEventListener("keydown", (event) => {
    const items = Array.from(menu.querySelectorAll('[role="menuitem"]'));
    const currentIndex = items.indexOf(document.activeElement);
    if(event.key === "Escape"){
      event.preventDefault();
      setPlannerOptimizeMenuOpen(false, {returnFocus:true});
      return;
    }
    if(event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const direction = event.key === "ArrowDown" ? 1 : -1;
    const nextIndex = currentIndex < 0
      ? (direction > 0 ? 0 : items.length - 1)
      : (currentIndex + direction + items.length) % items.length;
    items[nextIndex]?.focus();
  });

  document.addEventListener("click", (event) => {
    if(menu?.hidden !== false || controls?.contains(event.target)) return;
    setPlannerOptimizeMenuOpen(false);
  });

  document.addEventListener("keydown", (event) => {
    if(event.key !== "Escape" || menu?.hidden !== false) return;
    event.preventDefault();
    setPlannerOptimizeMenuOpen(false, {returnFocus:true});
  });

  const closeForPointerChange = () => setPlannerOptimizeMenuOpen(false);
  if(typeof desktopModeMedia.addEventListener === "function"){
    desktopModeMedia.addEventListener("change", closeForPointerChange);
  }else if(typeof desktopModeMedia.addListener === "function"){
    desktopModeMedia.addListener(closeForPointerChange);
  }

  window.togglePlannerOptimizeMenu = togglePlannerOptimizeMenu;
  window.runPlannerSchedulerMode = runPlannerSchedulerMode;
})();
</script>
