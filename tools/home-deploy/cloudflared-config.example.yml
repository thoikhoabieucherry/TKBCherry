# Đổi tên file thành cloudflared-config.yml và thay YOUR_DOMAIN.com
# Sau khi đăng ký domain, thêm domain vào Cloudflare (miễn phí) rồi chạy:
#   .\tools\home-deploy\setup-tunnel.ps1

tunnel: cherry-scheduler
credentials-file: REPLACE_AFTER_SETUP_TUNNEL.ps1

ingress:
  # Email OTP — chỉ route endpoint gửi mail
  - hostname: YOUR_DOMAIN.com
    path: /api/send-otp
    service: http://127.0.0.1:8787
  # Web + Rust API (bao gồm /api/health, /api/solve-data, ...)
  - hostname: YOUR_DOMAIN.com
    service: http://127.0.0.1:1010
  - service: http_status:404
