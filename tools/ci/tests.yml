name: Tests

on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-solver-tests:
    name: Python solver & contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solver_runtime/requirements.txt

      - name: Install solver dependencies
        run: python -m pip install -r solver_runtime/requirements.txt

      - name: Run solver_runtime test suite
        # Thư mục tests không có __init__.py nên `unittest discover` không dùng
        # được; liệt kê module tường minh (đã kiểm chứng cách gọi này chạy đúng).
        run: |
          MODULES=$(ls solver_runtime/tests/test_*.py | sed 's|/|.|g; s|\.py$||')
          python -m unittest $MODULES

  node-contract-tests:
    name: Node contract tests & JS syntax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Syntax-check planner bundles
        run: |
          for f in web/pages/*.js web/shared/*.js web/*.js; do
            node --check "$f"
          done

      - name: Run serverless node test suites
        # Ba file cần backend đang chạy (app_assignment_subject_visibility,
        # app_data_integrity, tkb_rust_bridge) được chạy trong lane e2e riêng
        # trước khi deploy, không chạy ở đây.
        run: |
          TESTS=$(ls e2e_tests/*_node.test.js | grep -v -e app_assignment_subject_visibility -e app_data_integrity -e tkb_rust_bridge)
          node --test $TESTS

  rust-check:
    name: Rust build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install SQLite dev library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: cargo check
        working-directory: rust_api
        run: cargo check --locked

      - name: cargo test
        working-directory: rust_api
        run: cargo test --locked

      - name: cargo clippy (advisory)
        working-directory: rust_api
        continue-on-error: true
        run: cargo clippy --locked -- -W clippy::all
